
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - THRIFTBUY</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>THRIFTBUY</h1>
            <p class="subtitle">Welcome</p>

            <form id="loginForm">
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required
                >

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >
                    
<button
    type="button"
    id="toggleLoginPassword"
    class="password-toggle"
    aria-label="Show password"
    aria-pressed="false"
>
    <svg class="eye-icon" viewBox="0 0 24 24"
         width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
</button>

                </div>

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage"></p>

            <p class="switch-page">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const toggleButton =
            document.getElementById("toggleLoginPassword");
        const passwordInput =
            document.getElementById("loginPassword");

        toggleButton.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            toggleButton.innerHTML = isHidden
    ? `<svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
         <path d="M3 3l18 18"/>
         <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
         <path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a15.7 15.7 0 01-4 4.7"/>
         <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 004-.8"/>
       </svg>`
    : `<svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
         <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
         <circle cx="12" cy="12" r="3"/>
       </svg>`;
            toggleButton.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
            toggleButton.setAttribute(
                "aria-pressed",
                String(isHidden)
            );
        });
    </script>
</body>
</html>
