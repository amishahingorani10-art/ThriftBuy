
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THRIFTBUY | Manage Users</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        header h2 { margin: 0; }

        .back {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 200px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            background: #1d4ed8;
            color: white;
        }

        .table-wrap {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0000000d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #e8eefc;
        }

        #message {
            color: #555;
            margin: 18px 0;
        }
    </style>
</head>

<body>
<header>
    <h2>THRIFTBUY Admin</h2>
    <a class="back" href="admin.html">← Back to Dashboard</a>
</header>

<main>
    <h1>Manage Users</h1>
    <p>View registered THRIFTBUY accounts.</p>

    <div class="toolbar">
        <input
            type="search"
            id="search"
            placeholder="Search by name, email or city..."
            aria-label="Search users"
        >
        <button id="refreshBtn">Refresh</button>
    </div>

    <p id="message">Checking admin access...</p>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>City</th>
                    <th>Role</th>
                    <th>Joined</th>
                </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>
</main>

<script>
const API = "http://127.0.0.1:5000/api";
let allUsers = [];

async function loadUsers() {
    const message = document.getElementById("message");
    const tbody = document.getElementById("usersBody");

    message.textContent = "Loading users...";
    tbody.replaceChildren();

    try {
        const response = await fetch(`${API}/admin/users`, {
            credentials: "include"
        });

        const data = await response.json();

        if (response.status === 401) {
            window.location.href = "login.html";
            return;
        }

        if (response.status === 403) {
            message.textContent = "Admin access only.";
            return;
        }

        if (!response.ok || !data.success) {
            message.textContent = data.message || "Unable to load users.";
            return;
        }

        allUsers = data.users || [];
        renderUsers();

    } catch (error) {
        console.error(error);
        message.textContent =
            "Cannot connect to Flask. Check that the backend is running.";
    }
}

function renderUsers() {
    const tbody = document.getElementById("usersBody");
    const message = document.getElementById("message");
    const search = document.getElementById("search").value
        .trim()
        .toLowerCase();

    tbody.replaceChildren();

    const filtered = allUsers.filter(user =>
        [user.name, user.email, user.city]
            .some(value => String(value || "").toLowerCase().includes(search))
    );

    if (filtered.length === 0) {
        message.textContent = "No matching users found.";
        return;
    }

    filtered.forEach(user => {
        const row = document.createElement("tr");

        [
            user.id,
            user.name,
            user.email,
            user.phone || "—",
            user.city || "—",
            user.role || "user",
            user.created_at || "—"
        ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        tbody.appendChild(row);
    });

    message.textContent = `Showing ${filtered.length} of ${allUsers.length} users.`;
}

document.getElementById("search").addEventListener("input", renderUsers);
document.getElementById("refreshBtn").addEventListener("click", loadUsers);

loadUsers();
</script>
</body>
</html>
